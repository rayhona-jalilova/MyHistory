<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MY HISTORY | Login</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
          href="assets/css/main.css">

    <link rel="stylesheet"
          href="assets/css/pages/login.css">

</head>

<body>

    <!-- Background -->

    <div class="background">

        <div class="stars"></div>

        <div class="aurora aurora-left"></div>

        <div class="aurora aurora-right"></div>

    </div>

    <!-- Login Card -->

    <main class="login-card">

        <!-- Logo -->

        <div class="logo-area">

            <img src="assets/images/logo/logo.png"
                 alt="MY HISTORY">

            <h1>MY HISTORY</h1>

            <p>Welcome Back</p>

        </div>

        <!-- Form -->

        <form
              id="loginForm">

            <!-- Email -->

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input

                    type="email"

                    id="email"

                    placeholder="Email Address"

                    required>

            </div>

            <!-- Password -->

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input

                    type="password"

                    id="password"

                    placeholder="Password"

                    required>

                <i

                    class="fa-solid fa-eye eye"

                    id="togglePassword">

                </i>

            </div>

            <!-- Remember -->

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <!-- Login -->

            <button
                    class="login-btn"
                    type="submit">

                Login

            </button>

        </form>

        <!-- Divider -->

        <div class="divider">

            <span>OR</span>

        </div>

        <!-- Google -->

        <button class="google-btn">

            <i class="fa-brands fa-google"></i>

            Continue with Google

        </button>

        <!-- Register -->

        <div class="register">

            Don't have an account?

            <a href="register.html">

                Register

            </a>

        </div>

    </main>

    <!-- JS -->

    <script src="assets/js/login.js"></script>

</body>

</html>
